[project]
name = "egfg"
version = "0.1.0"
description = "E-graph optimization of factor graph inference"
readme = "README.md"
authors = [
    { name = "Shunsuke Tamaki", email = "shnsk0204@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "egglog>=14,<15",
    "highspy>=1.15.1",
    "numpy>=2.0",
    "opt-einsum>=3.4.0",
    "pulp>=4.0.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
# existing libraries for comparison (arena/score_libs.py); not needed by the tests
libs = [
    "cotengra>=0.8.2",
    "dynamax>=1.0.2",
    "funsor>=0.4.8",
    "gtsam>=4.3.0",
    "jax>=0.11.2",
    "kahypar>=1.3.7",
    "pyagrum>=3.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["tests"]
# run in parallel (pytest-xdist); pass `-n 0` to run serially
addopts = "-n auto"
